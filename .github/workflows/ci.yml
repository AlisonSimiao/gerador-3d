name: ci

on:
  push:
  pull_request:

jobs:
  fast:
    name: fast (no bpy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Python 3.12 on purpose: the bpy pin only applies to 3.13, so this
      # job provably runs the fast level without Blender (release gate:
      # this job alone never approves a release).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -m "not integration" -q

  integration:
    name: integration (official Blender env, release gate)
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -m integration -q
