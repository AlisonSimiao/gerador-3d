[project]
name = "gerador-3d"
version = "0.1.0"
description = "SaaS de Assets 3D Low-Poly — worker procedural via Blender (Marco 1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bpy==5.2.2; python_version == '3.13'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blender_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the official Blender environment"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
show_error_codes = true

[tool.ruff]
line-length = 100
